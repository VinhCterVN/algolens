name: algolens
description: "See the Logic Behind Every Algorithm"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  supabase_flutter: ^2.18.3
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^11.2.0
  flutter_dotenv: ^6.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/
    - assets/auth/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
